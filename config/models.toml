# Model registry snapshot: 2026-08-18.
# "candidate" means benchmark candidate for the class, not an eternal SOTA claim.
# Remote entries are disabled unless --allow-paid is supplied.
# Price fields are USD per million input/output tokens and are used by the
# application-side spend fuse. Reconcile them before expensive runs.
#
# The machine-local llama.cpp server is a single-model endpoint on port 8000.
# Its advertised model name is kept literal so result metadata says what was
# actually served instead of hiding it behind a generic alias.

[[models]]
id = "qwen3-8b-q4-k-m"
label = "Qwen3 8B Q4_K_M (local GPU)"
class = "7to12b"
parameter_b = 8.19
active_parameter_b = 8.19
deployment = "local"
provider = "openai_compatible"
model = "Qwen3-8B-Q4_K_M"
base_url = "http://127.0.0.1:8000/v1"
base_url_env = "LOCAL_OPENAI_BASE_URL"
api_key_env = "LOCAL_API_KEY"
enabled = true
candidate = false
source = "https://huggingface.co/Qwen/Qwen3-8B-GGUF"

